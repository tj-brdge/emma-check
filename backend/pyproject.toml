[project]
name = "termscheck"
version = "0.1.0"
description = "Terms Check: find municipal bonds whose reference data misstates interest treatment"
requires-python = ">=3.12,<3.13"
# Ranges state what the code supports; exact, hash-pinned versions live in requirements*.lock
# (regenerate with: uv pip compile pyproject.toml --generate-hashes --python-version 3.12 ...;
# see README "Dependencies").
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "anthropic>=2.14,<3",          # messages.parse with server-side fallbacks; httpx2 transport
  "pypdf>=5.0,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "httpx2>=2.16,<3", "reportlab>=4.2,<6"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["termscheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls the real Anthropic API (requires ANTHROPIC_API_KEY)",
  "db: requires a PostgreSQL database (TERMSCHECK_TEST_DATABASE_URL)",
]
addopts = "-m 'not live'"
