[project]
name = "termscheck"
version = "0.1.0"
description = "Terms Check: find municipal bonds whose reference data misstates interest treatment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "anthropic>=0.70",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "reportlab>=4.2"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["termscheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls the real Anthropic API (requires ANTHROPIC_API_KEY)",
  "db: requires a PostgreSQL database (TERMSCHECK_TEST_DATABASE_URL)",
]
addopts = "-m 'not live'"
